version: v1
kind: Spicepod
name: rds_postgresql

datasets:
  - from: postgres:public.customers
    name: customers
    params:
      pg_host: ${env:RDS_ENDPOINT}
      pg_port: '5432'
      pg_db: testdb
      pg_user: postgres
      pg_pass: ${secrets:PG_PASS}
      pg_sslmode: require # "verify-full" is default
    acceleration:
      enabled: true
      refresh_mode: full
      refresh_check_interval: 10s
