version: v1
kind: Spicepod
name: postgres-accelerator

datasets:
  - from: spice.ai/spiceai/quickstart/datasets/taxi_trips
    name: taxi_trips
    acceleration:
      enabled: true
      refresh_mode: full
      refresh_check_interval: 10s
      engine: postgres
      params:
        pg_host: [Host]
        pg_db: [Database name]
        pg_port: [Port]
        pg_user: [User]
        pg_pass: ${env:PG_PASS}
