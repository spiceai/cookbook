version: v1
kind: Spicepod
name: supabase

datasets:
  - from: postgres:spice_test
    name: spice_test
    params:
      pg_host: aws-0-ap-northeast-2.pooler.supabase.com
      pg_db: postgres
      pg_port: 5432
      pg_user: postgres.gmipyuxjmtlqfqrjndon
      pg_pass: ${env:PG_PASS}
      pg_sslmode: require # "verify-full" is default
    acceleration:
      enabled: true
      refresh_mode: full
      refresh_check_interval: 10s
