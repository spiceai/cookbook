version: v2
kind: Spicepod
name: refresh-data-window

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    time_column: tpep_pickup_datetime
    params:
      file_format: parquet
      s3_auth: public
    acceleration:
      enabled: true
      engine: cayenne
      mode: memory
      refresh_data_window: 35040h # 4 years, this will evict 5 rows of data from the dataset
