version: v1
kind: Spicepod
name: spice.js-sdk-sample

# For Local Runtime: Start with `spice run` in this directory
#
# For Spice.ai Cloud: Manually deploy this spicepod through the web interface
# See https://docs.spice.ai/getting-started/get-started for detailed instructions

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    description: NYC taxi trips dataset from S3
    params:
      file_format: parquet
    acceleration:
      enabled: true
