plugins {
    id 'application'
}

group = 'ai.spice.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'ai.spice:spiceai:0.6.0'
}

application {
    mainClass = 'ai.spice.example.App'
}

// The Spice SDK uses Apache Arrow Flight library which requires `--add-opens=java.base/java.nio=ALL-UNNAMED` parameter to operate.
// Read https://arrow.apache.org/docs/java/install.html#java-compatibility for more details.

tasks.withType(JavaExec) {
    jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'

    // Arrow's Netty allocator uses sun.misc.Unsafe memory access, which JDK 24+ disables by
    // default (JEP 498). The flag was only added in JDK 23, so it is applied conditionally.
    if (JavaVersion.current().majorVersion.toInteger() >= 23) {
        jvmArgs '--sun-misc-unsafe-memory-access=allow'
    }
}
