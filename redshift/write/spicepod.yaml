version: v1
kind: Spicepod
name: tpch-write
datasets:
  - from: s3://spiceai-demo-datasets/tpch/customer/
    name: customer_source
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: cayenne
      refresh_sql: select * from customer_source limit 1000

  - from: postgres:public.customer
    name: customer
    access: read_write
    params:
      pg_host: ${secrets:PG_HOST}
      pg_port: 5439
      pg_sslmode: prefer
      pg_db: dev
      pg_user: ${secrets:PG_USER}
      pg_pass: ${secrets:PG_PASS}

  - from: s3://spiceai-demo-datasets/tpch/lineitem/
