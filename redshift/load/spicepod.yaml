version: v1beta1
kind: Spicepod
name: tpch
datasets:
  - from: s3://spiceai-demo-datasets/tpch/customer/
    name: tpch.customer
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: postgresql
      refresh_sql: select * from tpch.customer limit 1000
      params:
        pg_host: ${secrets:PG_HOST}
        pg_port: 5439
        pg_sslmode: prefer
        pg_db: dev
        pg_user: ${secrets:PG_USER}
        pg_pass: ${secrets:PG_PASS}

