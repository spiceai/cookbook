version: v2
kind: Spicepod
name: elasticsearch

embeddings:
  - from: openai:text-embedding-3-small
    name: openai_embeddings
    params:
      openai_api_key: ${secrets:OPENAI_API_KEY}

x-elasticsearch-fts: &elasticsearch_fts
  enabled: true
  engine: elasticsearch
  params:
    elasticsearch_endpoint: http://localhost:9200
    elasticsearch_user: ${secrets:ELASTIC_USER}
    elasticsearch_pass: ${secrets:ELASTIC_PASS}
    elasticsearch_index: fts_index

x-elasticsearch-vectors: &elasticsearch_vectors
  enabled: true
  engine: elasticsearch
  params:
    elasticsearch_endpoint: http://localhost:9200
    elasticsearch_user: ${secrets:ELASTIC_USER}
    elasticsearch_pass: ${secrets:ELASTIC_PASS}
    elasticsearch_index: vector_index
    elasticsearch_vector_field: content_embedding

datasets:
  - from: file:./articles.parquet
    name: articles
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow

    vectors: *elasticsearch_vectors

    full_text_search:
      <<: *elasticsearch_fts

    columns:
      - name: content
        embeddings:
          - from: openai_embeddings
            row_id:
              - id
            chunking:
              enabled: true
              target_chunk_size: 256
              overlap_size: 64

        full_text_search:
          <<: *elasticsearch_fts
          row_id:
            - id

      - name: title
        full_text_search:
          <<: *elasticsearch_fts
          row_id:
            - id
