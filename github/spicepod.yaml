version: v1
kind: Spicepod
name: github

datasets:
  - from: github:github.com/spiceai/spiceai/files/trunk
    name: spiceai.files
    params:
      github_token: ${secrets:GITHUB_TOKEN}
      include: '**/*.md'
    acceleration:
      enabled: true

  - from: github:github.com/spiceai/spiceai/issues
    name: spiceai.issues
    params:
      github_query_mode: search
      github_token: ${secrets:GITHUB_TOKEN}
    time_column: updated_at
    acceleration:
      enabled: true
      refresh_data_window: 7d

  - from: github:github.com/spiceai/spiceai/pulls
    name: spiceai.pulls
    params:
      github_query_mode: search
      github_token: ${secrets:GITHUB_TOKEN}
    time_column: updated_at
    acceleration:
      enabled: true
      refresh_data_window: 7d

  - from: github:github.com/spiceai/spiceai/commits
    name: spiceai.commits
    params:
      github_token: ${secrets:GITHUB_TOKEN}
    acceleration:
      enabled: true
      refresh_sql: |
        SELECT * FROM spiceai.commits LIMIT 300

  - from: github:github.com/spiceai/spiceai/stargazers
    name: spiceai.stargazers
    params:
      github_token: ${secrets:GITHUB_TOKEN}
    acceleration:
      enabled: true
      refresh_sql: |
        SELECT * FROM spiceai.stargazers LIMIT 300
