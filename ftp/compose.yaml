services:
  ftp-server:
    image: garethflowers/ftp-server:0.9.0
    container_name: my-ftp-server
    environment:
      - FTP_PASS=123
      - FTP_USER=user
    ports:
      - '20020-20021:20-21/tcp'
      - '40000-40009:40000-40009/tcp'
    volumes:
      - './data:/home/user'
  sftp-server:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
    container_name: my-sftp-server
    environment:
      - USER_NAME=user
      - USER_PASSWORD=123
      - PASSWORD_ACCESS=true
    ports:
      - '20022:2222/tcp'
    volumes:
      - './data:/data:ro'
