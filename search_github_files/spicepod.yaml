version: v1
kind: Spicepod
name: github-search-files

datasets:
  - from: github:github.com/spiceai/spiceai/files/trunk
    name: spiceai.files
    params:
      github_token: ${secrets:GITHUB_TOKEN}
      include: "docs/**/*.md"
    acceleration:
      enabled: true
