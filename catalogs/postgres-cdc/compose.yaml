services:
  postgres:
    image: postgres:16
    container_name: tpch-cdc-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # CDC replication connections authenticate with a password (pg_pass),
      # even though local connections are trusted. Set one so the replication
      # slot can be created.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpch
    # Catalog-level CDC acceleration streams changes from the PostgreSQL
    # write-ahead log. Logical decoding must be enabled, and the server must
    # allow at least one replication slot and WAL sender for Spice's shared
    # replication slot.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tpch"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    container_name: tpch-cdc-postgres-init
    build: postgres-init/
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: tpch
      PG_USER: postgres
