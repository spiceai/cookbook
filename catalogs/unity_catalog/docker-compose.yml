services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: unitycatalog-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio123
      RUSTFS_CONSOLE_ENABLE: "true"

  createbucket:
    image: amazon/aws-cli
    container_name: unitycatalog-createbucket
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket unity-catalog 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://unity-catalog
      "

  unitycatalog:
    image: unitycatalog/unitycatalog:latest
    container_name: unitycatalog
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  unitycatalog-seed:
    build: ./init
    container_name: unitycatalog-seed
    depends_on:
      unitycatalog:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: unity-catalog

  unitycatalog-ui:
    image: unitycatalog/unitycatalog-ui:main
    container_name: unitycatalog-ui
    ports:
      - "3000:3000"
    environment:
      - UNITY_CATALOG_URL=http://unitycatalog:8080
    depends_on:
      unitycatalog:
        condition: service_healthy
