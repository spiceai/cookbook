services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/unity-catalog &&
      exit 0
      "

  unitycatalog:
    image: unitycatalog/unitycatalog:latest
    container_name: unitycatalog
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  unitycatalog-seed:
    build: ./init
    container_name: unitycatalog-seed
    depends_on:
      unitycatalog:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: unity-catalog

  unitycatalog-ui:
    image: unitycatalog/unitycatalog-ui:main
    container_name: unitycatalog-ui
    ports:
      - "3000:3000"
    environment:
      - UNITY_CATALOG_URL=http://unitycatalog:8081
    depends_on:
      unitycatalog:
        condition: service_healthy
