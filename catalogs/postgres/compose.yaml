services:
  postgres:
    image: postgres:16
    container_name: tpch-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tpch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tpch"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    container_name: tpch-postgres-init
    build: postgres-init/
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: tpch
      PG_USER: postgres
