version: v1
kind: Spicepod
name: hadoop-catalog-recipe

catalogs:
    - from: iceberg:s3://hadoop/
      name: hadoop
      include:
         - "tpch.*"
      params:
          iceberg_s3_endpoint: http://localhost:9000
          iceberg_s3_access_key_id: admin
          iceberg_s3_secret_access_key: password
          iceberg_s3_region: us-east-1
