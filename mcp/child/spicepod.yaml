name: spicepod
version: v1
kind: Spicepod

runtime:
  auth:
    api_key:
      enabled: true
      keys:
        - ${ secrets:API_KEY }

tools:
  - name: spice_mcp
    from: mcp:http://localhost:8090/v1/mcp
    params:
      mcp_headers: "x-api-key: foobar"

models:
  - name: openai-with-spice
    from: openai:gpt-4o-mini
    params:
      openai_api_key: ${ secrets:SPICE_OPENAI_API_KEY }
      tools: spice_mcp
      system_prompt: |
        If you need to use the filesystem, check which directories are allowed by running `list_allowed_directories`.
