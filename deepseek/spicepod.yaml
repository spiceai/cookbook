version: v1
kind: Spicepod
name: deepseek

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    description: taxi trips in s3
    params:
      file_format: parquet
    acceleration:
      enabled: true

models:
  - from: openai:deepseek-chat
    name: deepseek
    params:
      tools: auto
      endpoint: https://api.deepseek.com
      openai_api_key: ${secrets:DEEPSEEK_API_KEY}
