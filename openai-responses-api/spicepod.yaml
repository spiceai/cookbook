version: v1
kind: Spicepod
name: github_pull_requests

# Dataset to use Spice tools on
datasets:
    - from: github:github.com/spiceai/spiceai/pulls
      name: pulls
      params:
          github_token: ${secrets:GITHUB_TOKEN}
      acceleration:
          enabled: true
          refresh_sql: select * from pulls limit 100;

models:
    # Model that can invoke OpenAI's Chat Completions API and OpenAI's Responses API
    - from: openai:gpt-4o
      name: gpt-4o-responses
      params:
          openai_api_key: ${secrets:OPENAI_API_KEY}
          responses_api: enabled
          openai_responses_tools: web_search, code_interpreter
          tools: auto
          system_prompt: Talk like a pirate
