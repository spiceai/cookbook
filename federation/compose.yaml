# PostgreSQL for the federated SQL query recipe.
#
# On first start, init/taxi_zones.sql creates the `taxi_zones` table and loads it
# from the cookbook `data` directory, which is mounted read-only at /data.
#
# The host port is 15432 so it doesn't clash with a PostgreSQL server already
# listening on 5432.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxi
    ports:
      - '15432:5432'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../data:/data:ro
    healthcheck:
      # Checked over TCP: during initialization PostgreSQL only listens on its Unix socket,
      # so this passes only once the init scripts have finished.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taxi -h localhost']
      interval: 2s
      timeout: 5s
      retries: 30
