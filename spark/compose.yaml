---
services:
  spark:
    container_name: spark
    build: spark/
    ports:
      - 8888:8888
      - 7077:7077
      - 8080:8080
      - 4040:4040
      - 15002:15002
    volumes:
      - ./notebooks:/home/spark/notebooks/notebooks
      - ./warehouse:/home/spark/warehouse
      - ./metastore:/home/spark/metastore
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

volumes:
  spark-warehouse:
  metastore:
