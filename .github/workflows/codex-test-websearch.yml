name: Codex Test - Web Search
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: websearch
      recipe_path: websearch
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates web search tools using Perplexity/Tavily.
        Requires SPICE_TAVILY_API_KEY and/or other API keys.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
