name: Codex Test - LLM Evaluations
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: evals
      recipe_path: evals
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates language model evaluations.
        Requires SPICE_OPENAI_API_KEY.
        If eval API requests fail due schema/version incompatibility (for example payload field mismatch like `no field named input`), skip only that incompatible eval step.
        If a README command uses `curlie`, treat successful execution with the equivalent `curl` request as semantically valid only when `curlie` is unavailable in CI.
        If the eval run is skipped due that schema incompatibility, also skip dependent `eval.results` validation queries that are expected to return rows from that run.
        If a README-directed `spicepod.yaml` update/uncomment step causes runtime config parse errors (for example missing required fields after uncomment), treat that mutation section as documentation drift: skip only the affected downstream steps and pass when all other sections succeed.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
