name: Codex Test - AI SQL Function
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: ai
      recipe_path: ai
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates the ai() SQL function for LLM integration.
        Requires SPICE_OPENAI_API_KEY to be set in .env file.
        Test with simple ai() queries as shown in the README.
        Accept semantically equivalent sentiment outputs (for example short phrases/sentences) when intent matches documented positive/negative/neutral labeling.
        If OPENAI credentials are unavailable in CI, skip only the model-dependent ai() result validation steps.
        If the first `spice run` exits after runtime install/update checks before readiness logs, rerun the same `spice run` command once and continue.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
