name: Codex Test - AI SQL Function
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: ai
      recipe_path: ai
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates the ai() SQL function for LLM integration.
        Requires SPICE_OPENAI_API_KEY to be set in .env file.
        Test with simple ai() queries as shown in the README.
        Do not skip steps; any Spice/runtime error or output mismatch must fail and indicates the recipe needs updating.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
