name: Codex Test - LLM Judge
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: llm-judge
      recipe_path: llm-judge
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates LLM as a judge for evaluations.
        Requires SPICE_OPENAI_API_KEY.
        If OPENAI credentials are unavailable in CI, skip only the model/eval-dependent validation steps.
        If `spice eval` fails with a transient local runtime connection error, wait briefly and retry the same eval command once before failing.
        If the eval endpoint remains unavailable after the required retry, skip only that eval-endpoint-dependent validation.
        When eval execution is skipped due endpoint unavailability, also skip dependent result-inspection steps (for example eval result queries/curl checks) that require successful eval output.
        If all non-skipped documented steps complete successfully, finalize with `TEST PASSED` (do not mark failure solely due explicitly allowed skipped eval-endpoint steps).
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
