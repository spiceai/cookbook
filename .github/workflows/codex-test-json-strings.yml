name: Codex Test - JSON Strings
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: json-strings
      recipe_path: json_strings
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: false
      additional_instructions: |
        This recipe demonstrates working with JSON string data in Spice.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
