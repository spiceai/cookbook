name: SpiceQA

on:
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        default: 'latest'
        type: string
      recipes:
        description: 'Comma-separated list of recipes to test (e.g., "ai,file"). Leave empty for all recipes.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      github_run_id:
        description: 'GitHub Actions run ID from spiceai/spiceai. If set, will install pre-release artifact. Otherwise installs the release version.'
        required: false
        type: string
        default: ''
      recipes:
        description: 'Comma-separated list of recipes to test (e.g., "ai,file"). Leave empty for all recipes.'
        required: false
        default: ''
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      SPICEAI_GH_TOKEN:
        required: false

# Limit GITHUB_TOKEN permissions for security
permissions:
  contents: read
  actions: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      simple_matrix: ${{ steps.set-matrix.outputs.simple_matrix }}
      secrets_matrix: ${{ steps.set-matrix.outputs.secrets_matrix }}
    steps:
      - name: Generate test matrix
        id: set-matrix
        run: |
          # Create arrays of recipes that don't require secrets
          # Format: name|path|timeout|minimum_version
          declare -a SIMPLE_RECIPES=(
            "clickhouse|clickhouse|10|"
            "evals|evals|25|"
            "file|file|10|"
            "sqlite-connector|duckdb/connector|10|"
            "duckdb-accelerator|duckdb/accelerator|10|"
            "federation|federation|10|"
            "full-text-search|full-text-search|10|"
            "localpod|localpod|10|"
            "mcp|mcp|15|"
            "scylladb|scylladb|15|v1.11.0-rc.1"
            "smb|smb|15|v1.11.0-rc.1"
            "views|views|10|"
          )

          # Recipes that require secrets
          declare -a SECRETS_RECIPES=(
            "ai|ai|15|"
          )

          # Filter recipes if a filter is specified
          FILTER="${{ inputs.recipes }}"

          filter_recipes() {
            local -n recipes=$1
            local filter="$2"
            local -a filtered=()

            if [ -z "$filter" ]; then
              # No filter, return all
              for r in "${recipes[@]}"; do
                filtered+=("$r")
              done
            else
              # Apply filter
              IFS=',' read -ra FILTER_ARRAY <<< "$filter"
              for r in "${recipes[@]}"; do
                name="${r%%|*}"
                for f in "${FILTER_ARRAY[@]}"; do
                  f=$(echo "$f" | xargs) # trim whitespace
                  if [ "$name" == "$f" ]; then
                    filtered+=("$r")
                    break
                  fi
                done
              done
            fi

            printf '%s\n' "${filtered[@]}"
          }

          # Generate filtered arrays
          mapfile -t FILTERED_SIMPLE < <(filter_recipes SIMPLE_RECIPES "$FILTER")
          mapfile -t FILTERED_SECRETS < <(filter_recipes SECRETS_RECIPES "$FILTER")

          # Build JSON for simple matrix
          build_json() {
            local -a recipes=("$@")
            local json='{"include":['
            local first=true
            for r in "${recipes[@]}"; do
              IFS='|' read -r name path timeout min_ver <<< "$r"
              if [ "$first" = true ]; then
                first=false
              else
                json+=','
              fi
              json+="{\"name\":\"$name\",\"path\":\"$path\",\"timeout\":$timeout"
              if [ -n "$min_ver" ]; then
                json+=",\"min_ver\":\"$min_ver\""
              fi
              json+='}'
            done
            json+=']}'
            echo "$json"
          }

          if [ ${#FILTERED_SIMPLE[@]} -gt 0 ]; then
            SIMPLE_JSON=$(build_json "${FILTERED_SIMPLE[@]}")
            echo "simple_matrix=$SIMPLE_JSON" >> $GITHUB_OUTPUT
          else
            echo 'simple_matrix={"include":[]}' >> $GITHUB_OUTPUT
          fi

          if [ ${#FILTERED_SECRETS[@]} -gt 0 ]; then
            SECRETS_JSON=$(build_json "${FILTERED_SECRETS[@]}")
            echo "secrets_matrix=$SECRETS_JSON" >> $GITHUB_OUTPUT
          else
            echo 'secrets_matrix={"include":[]}' >> $GITHUB_OUTPUT
          fi

  test-simple:
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.simple_matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.simple_matrix) }}
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: ${{ matrix.name }}
      recipe_path: ${{ matrix.path }}
      timeout_minutes: ${{ matrix.timeout }}
      spice_version: ${{ inputs.spice_version || 'latest' }}
      github_run_id: ${{ inputs.github_run_id || '' }}
      requires_secrets: false
      minimum_version: ${{ matrix.min_ver || '' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPICEAI_GH_TOKEN: ${{ secrets.SPICEAI_GH_TOKEN }}

  test-with-secrets:
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.secrets_matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.secrets_matrix) }}
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: ${{ matrix.name }}
      recipe_path: ${{ matrix.path }}
      timeout_minutes: ${{ matrix.timeout }}
      spice_version: ${{ inputs.spice_version || 'latest' }}
      github_run_id: ${{ inputs.github_run_id || '' }}
      requires_secrets: true
      minimum_version: ${{ matrix.min_ver || '' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPICEAI_GH_TOKEN: ${{ secrets.SPICEAI_GH_TOKEN }}

  report:
    needs: [test-simple, test-with-secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-result-*
          merge-multiple: true
          path: test_results
        continue-on-error: true

      - name: Generate summary
        env:
          SIMPLE_STATUS: ${{ needs.test-simple.result }}
          SECRETS_STATUS: ${{ needs.test-with-secrets.result }}
        run: |
          echo "# SpiceQA Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job Group | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Simple Recipes | ${SIMPLE_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Recipes | ${SECRETS_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find and display results from all log files
          if [ -d "test_results" ]; then
            for log in test_results/*.log; do
              if [ -f "$log" ]; then
                RECIPE_NAME=$(basename "$log" .log)
                # Extract last line or relevant result
                RESULT=$(tail -1 "$log" 2>/dev/null || echo "No output")
                echo "### $RECIPE_NAME" >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                tail -20 "$log" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output available"
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "No test result artifacts found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report overall status
        env:
          SIMPLE_STATUS: ${{ needs.test-simple.result }}
          SECRETS_STATUS: ${{ needs.test-with-secrets.result }}
        run: |
          # Treat 'skipped' as success (matrix was empty)
          SIMPLE="${SIMPLE_STATUS}"
          SECRETS="${SECRETS_STATUS}"

          if [[ "$SIMPLE" == "skipped" ]]; then SIMPLE="success"; fi
          if [[ "$SECRETS" == "skipped" ]]; then SECRETS="success"; fi

          if [[ "$SIMPLE" == "success" && "$SECRETS" == "success" ]]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            echo "  Simple recipes: ${SIMPLE_STATUS}"
            echo "  Secret recipes: ${SECRETS_STATUS}"
            exit 1
          fi

# Skipped recipes (require external services or complex setup):
# - acceleration/* (cron, data-refresh, indexes, partitioning, snapshots, constraints)
# - api_key (needs API key setup)
# - architectures/* (microservice, sidecar - complex multi-container setup)
