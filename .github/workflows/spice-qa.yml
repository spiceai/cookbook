name: SpiceQA
on:
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test (e.g. v1.0.6 or latest)'
        required: false
        type: string
        default: 'latest'
      include_secrets_recipes:
        description: 'Include recipes that require API keys/secrets'
        required: false
        type: boolean
        default: false
  # Run weekly on Mondays at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

# This workflow triggers all individual recipe test workflows
# Docker-dependent recipes are excluded as they cannot run docker-in-docker
# Skipped recipes: cdc-debezium, cqrs, docker, ftp, grafana-datasource, kafka,
#                  oracle, retention, tls, sales-bi, spark, catalogs/iceberg,
#                  catalogs/iceberg-hadoop, acceleration/constraints

jobs:
  # ============================================
  # Simple Recipes (No external dependencies)
  # ============================================
  trigger-simple-recipes:
    name: Trigger ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - file
          - duckdb-connector
          - duckdb-accelerator
          - sqlite-accelerator
          - arrow
          - cayenne
          - http
          - json-strings
          - hashed-partitioning
          - localpod
          - views
          - vectors
          - federation
          - mcp
          - search
    steps:
      - name: Dispatch workflow
        uses: actions/github-script@v7
        with:
          script: |
            const spiceVersion = '${{ inputs.spice_version }}';
            const inputs = {};
            if (spiceVersion && spiceVersion !== 'latest') {
              inputs.spice_version = spiceVersion;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codex-test-${{ matrix.recipe }}.yml',
              ref: context.ref,
              inputs: inputs
            });

  # ============================================
  # Recipes Requiring Secrets (API Keys)
  # ============================================
  trigger-secrets-recipes:
    name: Trigger ${{ matrix.recipe }}
    if: ${{ inputs.include_secrets_recipes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - ai
          - deepseek
          - llm-memory
          - llm-judge
          - evals
          - text-to-sql
          - websearch
          - github
          - graphql
          - search-github-files
          - models-openai
          - openai-sdk
          - openai-responses-api
    steps:
      - name: Dispatch workflow
        uses: actions/github-script@v7
        with:
          script: |
            const spiceVersion = '${{ inputs.spice_version }}';
            const inputs = {};
            if (spiceVersion && spiceVersion !== 'latest') {
              inputs.spice_version = spiceVersion;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codex-test-${{ matrix.recipe }}.yml',
              ref: context.ref,
              inputs: inputs
            });

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [trigger-simple-recipes]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## SpiceQA Workflow Dispatch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All recipe test workflows have been triggered as separate runs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Triggered Workflows" >> $GITHUB_STEP_SUMMARY
          echo "- Simple recipes: 15 workflows" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.include_secrets_recipes }}" == "true" ]; then
            echo "- Secrets recipes: 13 workflows" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Secrets recipes: Skipped (set include_secrets_recipes to trigger)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Skipped Recipes (Docker-in-Docker Not Supported)" >> $GITHUB_STEP_SUMMARY
          echo "- cdc-debezium, cqrs, docker, ftp, grafana-datasource" >> $GITHUB_STEP_SUMMARY
          echo "- kafka, oracle, retention, tls, sales-bi, spark" >> $GITHUB_STEP_SUMMARY
          echo "- catalogs/iceberg, catalogs/iceberg-hadoop, acceleration/constraints" >> $GITHUB_STEP_SUMMARY
