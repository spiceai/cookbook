name: Codex Test - SQLite Accelerator
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: sqlite-accelerator
      recipe_path: sqlite/accelerator
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: false
      additional_instructions: |
        This recipe demonstrates using SQLite as an acceleration engine.
        When toggling acceleration in `spicepod.yaml`, do not fail solely on missing/changed runtime reload log lines; validate by successful queries and accelerated behavior instead.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
