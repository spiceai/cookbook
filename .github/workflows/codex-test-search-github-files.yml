name: Codex Test - Search GitHub Files
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: search-github-files
      recipe_path: search_github_files
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates searching GitHub files with embeddings.
        Requires GITHUB_TOKEN and SPICE_OPENAI_API_KEY.
        Treat SQL search output as semantically passing when documented expected paths/rows are present, even if additional relevant rows are returned.
        For vector search examples, treat ranking/path variability as non-deterministic; pass when results are relevant to the query and include at least one documented expected path, even if the second returned path differs.
        If the optional pre-existing-embeddings section fails because datasource `spiceai.files` is missing on the alternate endpoint (for example `localhost:8091`) after restart/reconfiguration, skip only that optional section.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
