name: Codex Test - Search GitHub Files
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: search-github-files
      recipe_path: search_github_files
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates searching GitHub files with embeddings.
        Requires GITHUB_TOKEN and SPICE_OPENAI_API_KEY.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
