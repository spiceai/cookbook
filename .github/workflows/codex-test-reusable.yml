name: Reusable Codex Test Workflow
on:
  workflow_call:
    inputs:
      recipe_name:
        description: 'Human-readable name of the recipe'
        required: true
        type: string
      recipe_path:
        description: 'Path to the recipe directory relative to repo root'
        required: true
        type: string
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
      timeout_minutes:
        description: 'Timeout for the test in minutes'
        required: false
        type: number
        default: 15
      requires_secrets:
        description: 'Whether the recipe requires secrets/API keys'
        required: false
        type: boolean
        default: false
      additional_instructions:
        description: 'Additional instructions for Codex CLI'
        required: false
        type: string
        default: ''
      use_docker:
        description: 'Whether to use Docker container (for tests requiring Docker)'
        required: false
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false

env:
  TEST_PROMPT_TEMPLATE: |
    You are testing the '{recipe_name}' cookbook recipe.
    Your task:
    1. Read the README.md in the current directory to understand the recipe
    2. Follow the setup and testing instructions in the README
    3. Start Spice with 'spice run' (run it in the background if needed)
    4. Execute any SQL queries or tests mentioned in the README using 'spice sql'
    5. Verify that the expected outputs match what is documented
    6. Report SUCCESS if all steps complete correctly, or FAILURE with details if any step fails
    {additional_instructions}
    Important:
    - If a step requires external credentials or services not available, skip that step and note it
    - Timeout is {timeout} minutes
    - Be thorough but efficient
    - End your response with either '✅ TEST PASSED' or '❌ TEST FAILED: <reason>'

jobs:
  test-macos:
    name: Test ${{ inputs.recipe_name }} (macOS)
    if: ${{ !inputs.use_docker }}
    runs-on: spiceai-macos
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      OUTPUT_FILE: ${{ github.workspace }}/test_results/${{ inputs.recipe_name }}.log
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Spice CLI
        run: |
          curl https://install.spiceai.org | /bin/bash
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: Install specific Spice version
        if: ${{ inputs.spice_version != 'latest' && inputs.spice_version != '' }}
        run: spice install ${{ inputs.spice_version }}

      - name: Verify Spice installation
        run: spice version

      - name: Create output directory
        run: mkdir -p test_results

      - name: Setup environment file
        if: ${{ inputs.requires_secrets }}
        working-directory: ${{ inputs.recipe_path }}
        run: |
          echo "SPICE_OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "GITHUB_TOKEN=${{ github.token }}" >> .env
          echo "GH_TOKEN=${{ github.token }}" >> .env

      - name: Build test prompt
        id: prompt
        run: |
          prompt="${{ env.TEST_PROMPT_TEMPLATE }}"
          prompt="${prompt//\{recipe_name\}/${{ inputs.recipe_name }}}"
          prompt="${prompt//\{timeout\}/${{ inputs.timeout_minutes }}}"
          prompt="${prompt//\{additional_instructions\}/${{ inputs.additional_instructions }}}"
          echo "value<<PROMPT_EOF" >> $GITHUB_OUTPUT
          echo "$prompt" >> $GITHUB_OUTPUT
          echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Run Codex CLI test
        id: codex_test
        working-directory: ${{ inputs.recipe_path }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
                --model gpt-5.2-codex \
                --full-auto \
                --no-mcp \
                "${{ steps.prompt.outputs.value }}" \
                2>&1 | tee "${{ env.OUTPUT_FILE }}"

          # Check if codex produced valid output with a test result
          if grep -q "✅ TEST PASSED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          elif grep -q "❌ TEST FAILED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=error" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-result-${{ inputs.recipe_name }}
          path: test_results/
          if-no-files-found: warn

      - name: Display test output on failure
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: |
          echo "::error::Test failed for ${{ inputs.recipe_name }}"
          cat "${{ env.OUTPUT_FILE }}" || echo "No log file found"

      - name: Fail workflow if test failed
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: exit 1

  test-docker:
    name: Test ${{ inputs.recipe_name }} (Docker)
    if: ${{ inputs.use_docker }}
    runs-on: spiceai-dev-runners
    container:
      image: ubuntu:22.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      OUTPUT_FILE: ${{ github.workspace }}/test_results/${{ inputs.recipe_name }}.log
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl git ca-certificates gnupg

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Spice CLI
        run: |
          curl https://install.spiceai.org | /bin/bash
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: Install specific Spice version
        if: ${{ inputs.spice_version != 'latest' && inputs.spice_version != '' }}
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          spice install ${{ inputs.spice_version }}

      - name: Verify Spice installation
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          spice version

      - name: Create output directory
        run: mkdir -p test_results

      - name: Setup environment file
        if: ${{ inputs.requires_secrets }}
        working-directory: ${{ inputs.recipe_path }}
        run: |
          echo "SPICE_OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "GITHUB_TOKEN=${{ github.token }}" >> .env
          echo "GH_TOKEN=${{ github.token }}" >> .env

      - name: Build test prompt
        id: prompt
        run: |
          prompt="${{ env.TEST_PROMPT_TEMPLATE }}"
          prompt="${prompt//\{recipe_name\}/${{ inputs.recipe_name }}}"
          prompt="${prompt//\{timeout\}/${{ inputs.timeout_minutes }}}"
          prompt="${prompt//\{additional_instructions\}/${{ inputs.additional_instructions }}}"
          echo "value<<PROMPT_EOF" >> $GITHUB_OUTPUT
          echo "$prompt" >> $GITHUB_OUTPUT
          echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Run Codex CLI test
        id: codex_test
        working-directory: ${{ inputs.recipe_path }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export PATH="$HOME/.spice/bin:$PATH"
          codex exec \
                --model gpt-5.2-codex \
                --full-auto \
                --no-mcp \
                "${{ steps.prompt.outputs.value }}" \
                2>&1 | tee "${{ env.OUTPUT_FILE }}"

          # Check if codex produced valid output with a test result
          if grep -q "✅ TEST PASSED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          elif grep -q "❌ TEST FAILED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=error" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-result-${{ inputs.recipe_name }}-docker
          path: test_results/
          if-no-files-found: warn

      - name: Display test output on failure
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: |
          echo "::error::Test failed for ${{ inputs.recipe_name }}"
          cat "${{ env.OUTPUT_FILE }}" || echo "No log file found"

      - name: Fail workflow if test failed
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: exit 1
