name: Reusable Codex Test Workflow
on:
  workflow_call:
    inputs:
      recipe_name:
        description: 'Human-readable name of the recipe'
        required: true
        type: string
      recipe_path:
        description: 'Path to the recipe directory relative to repo root'
        required: true
        type: string
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
      timeout_minutes:
        description: 'Timeout for the test in minutes'
        required: false
        type: number
        default: 15
      requires_secrets:
        description: 'Whether the recipe requires secrets/API keys'
        required: false
        type: boolean
        default: false
      additional_instructions:
        description: 'Additional instructions for Codex CLI'
        required: false
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  test:
    name: Test ${{ inputs.recipe_name }}
    runs-on: spiceai-dev-runners
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      OUTPUT_FILE: ${{ github.workspace }}/test_results/${{ inputs.recipe_name }}.log
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Authenticate Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Install Spice CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl https://install.spiceai.org | /bin/bash
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: Install specific Spice version
        if: ${{ inputs.spice_version != 'latest' && inputs.spice_version != '' }}
        run: spice install ${{ inputs.spice_version }}

      - name: Verify Spice installation
        run: spice version

      - name: Create output directory
        run: mkdir -p test_results

      - name: Setup environment file
        if: ${{ inputs.requires_secrets }}
        working-directory: ${{ inputs.recipe_path }}
        run: |
          echo "SPICE_OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "GITHUB_TOKEN=${{ github.token }}" >> .env
          echo "GH_TOKEN=${{ github.token }}" >> .env

      - name: Build test prompt
        id: prompt
        run: |
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          You are a QA tester validating the '${{ inputs.recipe_name }}' cookbook recipe.

          YOUR MISSION: Execute the README.md instructions EXACTLY as written and verify they work.
          This is a documentation test - if the documented steps don't work, that's a bug we need to know about.

          STRICT RULES:
          - Follow EVERY command in the README.md exactly as documented, character for character
          - Do NOT improvise, fix, or work around any issues
          - Do NOT modify any files unless the README explicitly instructs you to
          - Do NOT try alternative approaches if something fails
          - If a command fails or output doesn't match, STOP and report FAILURE immediately
          - The recipe must work exactly as documented or it's a test failure

          STEPS:
          1. Read the README.md to understand what commands to run
          2. Execute each command exactly as shown in the README
          3. Start Spice with 'spice run' when instructed (run in background with & if needed)
          4. Run SQL queries exactly as documented using 'spice sql'
          5. Compare actual output to expected output shown in README
          6. If ANY step fails or differs from documentation, report FAILURE

          ${{ inputs.additional_instructions }}

          IMPORTANT:
          - If external credentials/services are unavailable, note it and skip ONLY that specific step
          - Timeout is ${{ inputs.timeout_minutes }} minutes
          - End with exactly '✅ TEST PASSED' if ALL documented steps work, or '❌ TEST FAILED: <reason>' if ANY step fails
          PROMPT_EOF
          echo "file=/tmp/prompt.txt" >> $GITHUB_OUTPUT

      - name: Run Codex CLI test
        id: codex_test
        working-directory: ${{ inputs.recipe_path }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
                --model gpt-5.2 \
                --dangerously-bypass-approvals-and-sandbox \
                "$(cat ${{ steps.prompt.outputs.file }})" \
                2>&1 | tee "${{ env.OUTPUT_FILE }}"

          # Check if codex produced valid output with a test result
          if grep -q "✅ TEST PASSED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          elif grep -q "❌ TEST FAILED" "${{ env.OUTPUT_FILE }}"; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=error" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-result-${{ inputs.recipe_name }}
          path: test_results/
          if-no-files-found: warn

      - name: Display test output on failure
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: |
          echo "::error::Test failed for ${{ inputs.recipe_name }}"
          cat "${{ env.OUTPUT_FILE }}" || echo "No log file found"

      - name: Fail workflow if test failed
        if: ${{ steps.codex_test.outputs.result != 'passed' }}
        run: exit 1
