name: Codex Test - OpenAI Responses API
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: openai-responses-api
      recipe_path: openai-responses-api
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates OpenAI's Responses API with Spice.
        Requires OPENAI_API_KEY.
        If README uses `spice chat --responses` and the installed CLI does not support `--responses`, use `spice chat` as the equivalent command and continue.
        If web-search capability is unavailable in the runtime/model for this environment, skip only that web-search-dependent prompt validation.
        If code-interpreter/tool-execution capability is unavailable in the runtime/model for this environment, skip only that code-execution-dependent prompt validation.
        If the SDK client step fails due Responses API schema/version incompatibility (for example `Invalid 'input[1].id' ... expected ... begins with 'fc'`), skip only that incompatible client step.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
