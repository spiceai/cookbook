name: Codex Test - Search
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: search
      recipe_path: search
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: false
      additional_instructions: |
        This recipe demonstrates search capabilities in Spice.
        For `spice chat` steps, evaluate success semantically rather than exact wording.
        If a chat response is a transient retrieval/tool-use error but the command itself succeeds, retry the same documented prompt once.
        Treat the chat validation as passed if a retry returns a valid answer aligned with the prompt intent.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
