name: Codex Test - DuckDB Connector
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: duckdb-connector
      recipe_path: duckdb/connector
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: false
      additional_instructions: |
        This recipe demonstrates using DuckDB as a data source.
        The DuckDB database file may need to be created or downloaded.
        Do not skip steps; any Spice/runtime error or output mismatch must fail and indicates the recipe needs updating.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
