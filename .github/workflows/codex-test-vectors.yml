name: Codex Test - Vectors
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: vectors
      recipe_path: vectors/s3
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates vector embeddings and similarity search.
        May use public data or local embeddings.
        This recipe is credential-dependent (OpenAI, GitHub, AWS S3 Vectors). If startup fails due invalid/missing external credentials (e.g. OpenAI `invalid_api_key`, GitHub `401`, or S3 Vectors auth), treat those steps as skipped external dependencies and do not fail solely for that reason.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
