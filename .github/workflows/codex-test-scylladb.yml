name: Codex Test - ScyllaDB Data Connector
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: scylladb
      recipe_path: scylladb
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: false
      minimum_version: v1.11.0-rc.2
      additional_instructions: |
        This recipe demonstrates using ScyllaDB as a federated data source.

        DOCKER SETUP (REQUIRED):
        1. Start the ScyllaDB container: docker run --name scylladb -d -p 9042:9042 scylladb/scylla
        2. Wait for ScyllaDB to be ready (check with: docker logs scylladb | grep "listening on")
        3. Create keyspace and sample data using cqlsh as documented in README

        Treat readiness log matching as case-insensitive for this check (`listening on` vs `Listening on`).

        After Docker setup, proceed with the spicepod configuration and queries.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
