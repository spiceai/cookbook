name: Codex Test - OpenAI Models
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: models-openai
      recipe_path: models/openai
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates using OpenAI LLM and embedding models.
        Requires SPICE_OPENAI_API_KEY.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
