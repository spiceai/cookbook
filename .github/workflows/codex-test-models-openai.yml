name: Codex Test - OpenAI Models
on:
  workflow_call:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spice_version:
        description: 'Spice.ai version to test'
        required: false
        type: string
        default: 'latest'
jobs:
  test:
    uses: ./.github/workflows/codex-test-reusable.yml
    with:
      recipe_name: models-openai
      recipe_path: models/openai
      spice_version: ${{ inputs.spice_version }}
      requires_secrets: true
      additional_instructions: |
        This recipe demonstrates using OpenAI LLM and embedding models.
        Requires SPICE_OPENAI_API_KEY.
        If SQL queries return temporary warmup messages (for example acceleration not ready), wait briefly and retry the same documented query up to 2 times before failing.
        If the same warmup message persists after retries, skip only that warmup-blocked query validation and continue with remaining documented steps.
        Apply the same warmup retry/skip handling to the documented vector search `curl /v1/search` step when it returns only acceleration-warmup errors.
        If the documented `spice chat` prompt returns only dataset-loading/warmup messages after retry, skip only that warmup-blocked chat validation.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
