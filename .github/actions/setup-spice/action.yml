name: 'Setup Spice'
description: 'Install Spice CLI from a release or GitHub Actions run artifacts'
inputs:
  version:
    description: 'Spice version to install (e.g. v1.0.6 or latest). Ignored if github-run-id is provided.'
    required: false
    default: 'latest'
  github-run-id:
    description: 'GitHub Actions run ID to download pre-release artifacts from spiceai/spiceai repo'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for downloading artifacts (needs read access to spiceai/spiceai for pre-release builds)'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Install Spice from release
      if: ${{ inputs.github-run-id == '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "Installing Spice CLI..."
        curl -fsSL https://install.spiceai.org | /bin/bash
        echo "$HOME/.spice/bin" >> $GITHUB_PATH

    - name: Install specific Spice version
      if: ${{ inputs.github-run-id == '' && inputs.version != 'latest' && inputs.version != '' }}
      shell: bash
      run: |
        export PATH="$HOME/.spice/bin:$PATH"
        echo "Installing Spice version: ${{ inputs.version }}"
        spice install ${{ inputs.version }}

    - name: Install GitHub CLI
      if: ${{ inputs.github-run-id != '' }}
      shell: bash
      run: |
        if ! command -v gh &> /dev/null; then
          echo "Installing GitHub CLI..."
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [ "$OS" == "linux" ]; then
            # Install gh on Linux
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          elif [ "$OS" == "darwin" ]; then
            # Install gh on macOS
            brew install gh
          else
            echo "::error::Unsupported OS for GitHub CLI installation: $OS"
            exit 1
          fi
        else
          echo "GitHub CLI already installed"
        fi
        gh --version

    - name: Download Spice from GitHub run artifacts
      if: ${{ inputs.github-run-id != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "Downloading Spice artifacts from run: ${{ inputs.github-run-id }}"

        # Create temp directory for artifacts
        mkdir -p /tmp/spice-artifacts
        cd /tmp/spice-artifacts

        # Detect OS and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case "$OS" in
          linux)
            case "$ARCH" in
              x86_64) 
                OS_ARCH="linux_amd64"
                ALT_OS_ARCH="linux-x86_64"
                ;;
              aarch64|arm64) 
                OS_ARCH="linux_arm64"
                ALT_OS_ARCH="linux-aarch64"
                ;;
              *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            ;;
          darwin)
            case "$ARCH" in
              x86_64) 
                OS_ARCH="darwin_amd64"
                ALT_OS_ARCH="darwin-x86_64"
                ;;
              arm64) 
                OS_ARCH="darwin_arm64"
                ALT_OS_ARCH="darwin-aarch64"
                ;;
              *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            ;;
          *)
            echo "::error::Unsupported OS: $OS"
            exit 1
            ;;
        esac

        # List available artifacts from the run
        echo "Listing available artifacts from run ${{ inputs.github-run-id }}..."
        AVAILABLE_ARTIFACTS=$(gh run view ${{ inputs.github-run-id }} --repo spiceai/spiceai --json artifacts -q '.artifacts[].name' 2>/dev/null || echo "")

        if [ -z "$AVAILABLE_ARTIFACTS" ]; then
          echo "::error::Could not list artifacts or no artifacts found for run ${{ inputs.github-run-id }}"
          echo "This could mean:"
          echo "  - The run ID is invalid"
          echo "  - Artifacts have expired (GitHub retains artifacts for 90 days by default)"
          echo "  - The token doesn't have permission to access artifacts"
          exit 1
        fi

        echo "Available artifacts:"
        echo "$AVAILABLE_ARTIFACTS"

        # Try different artifact name patterns
        ARTIFACT_NAME=""
        for pattern in "spice_${OS_ARCH}" "spice-${OS_ARCH}" "spice_${ALT_OS_ARCH}" "spice-${ALT_OS_ARCH}" "build_${OS_ARCH}" "build-${OS_ARCH}"; do
          if echo "$AVAILABLE_ARTIFACTS" | grep -q "^${pattern}$"; then
            ARTIFACT_NAME="$pattern"
            break
          fi
        done

        # If no exact match, try partial match
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(echo "$AVAILABLE_ARTIFACTS" | grep -i "${OS_ARCH}\|${ALT_OS_ARCH}" | head -1)
        fi

        if [ -z "$ARTIFACT_NAME" ]; then
          echo "::error::Could not find matching artifact for ${OS_ARCH}"
          echo "Available artifacts: $AVAILABLE_ARTIFACTS"
          exit 1
        fi

        echo "Downloading artifact: $ARTIFACT_NAME"

        # Download the artifact from the spiceai/spiceai repo
        gh run download ${{ inputs.github-run-id }} \
          --repo spiceai/spiceai \
          --name "$ARTIFACT_NAME" \
          --dir .

        # Extract if tarball exists
        TARBALL=$(find . -name "*.tar.gz" -type f | head -1)
        if [ -n "$TARBALL" ]; then
          echo "Extracting $TARBALL..."
          tar -xzf "$TARBALL"
        fi

        # Find the spice binary and spiced binary
        SPICE_BIN=$(find . -name "spice" -type f ! -name "*.tar.gz" | head -1)
        SPICED_BIN=$(find . -name "spiced" -type f | head -1)

        if [ -z "$SPICE_BIN" ]; then
          echo "::error::Could not find spice binary in artifacts"
          echo "Contents of artifact directory:"
          ls -laR .
          exit 1
        fi

        # Install to ~/.spice/bin
        mkdir -p $HOME/.spice/bin
        cp "$SPICE_BIN" $HOME/.spice/bin/spice
        chmod +x $HOME/.spice/bin/spice

        if [ -n "$SPICED_BIN" ]; then
          cp "$SPICED_BIN" $HOME/.spice/bin/spiced
          chmod +x $HOME/.spice/bin/spiced
        fi

        echo "$HOME/.spice/bin" >> $GITHUB_PATH
        echo "Installed Spice from GitHub run ${{ inputs.github-run-id }}"

    - name: Verify Spice installation
      shell: bash
      run: |
        export PATH="$HOME/.spice/bin:$PATH"
        echo "Spice installation verified:"
        spice version
