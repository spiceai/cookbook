version: v1
kind: Spicepod
name: rds_aurora_mysql
datasets:
  - from: mysql:testdb.customers
    name: customers
    params:
      mysql_host: ${env:AURORA_READER_ENDPOINT}
      mysql_tcp_port: '3306'
      mysql_db: testdb
      mysql_user: admin
      mysql_pass: ${secrets:MYSQL_PASS}
      mysql_sslmode: preferred # "required" is default
    acceleration:
      enabled: true
      refresh_mode: full
      refresh_check_interval: 10s
