version: v1
kind: Spicepod
name: planetscale

datasets:
  - from: mysql:[remote_table_path]
    name: [local_table_name]
    description: test planetscale table
    acceleration:
      enabled: true
      refresh_check_interval: 10s
      refresh_mode: full
    params:
      mysql_host: [mysql_host]
      mysql_db: [mysql_db]
      mysql_user: [mysql_user]
      mysql_pass: ${env:MYSQL_PASS}
