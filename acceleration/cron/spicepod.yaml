version: v2
kind: Spicepod
name: cron-refresh

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    description: taxi trips in s3
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: cayenne
      # Uncomment to reload taxi_trips every 30 seconds, as in the README.
      # refresh_cron: "*/30 * * * * *"
