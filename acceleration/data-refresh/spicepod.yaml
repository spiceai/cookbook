version: v2
kind: Spicepod
name: data-refresh

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    description: taxi trips in s3
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: cayenne
      mode: memory
      refresh_mode: full
      refresh_sql: select * from taxi_trips where passenger_count = 2
