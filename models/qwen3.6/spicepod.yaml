version: v2
kind: Spicepod
name: qwen3.6

datasets:
  - from: s3://spiceai-demo-datasets/taxi_trips/2024/
    name: taxi_trips
    description: NYC yellow taxi trips, 2024
    params:
      file_format: parquet
      s3_auth: public
    acceleration:
      enabled: true

models:
  # Qwen3.6-35B-A3B (36B total, 3B active), Unsloth Dynamic 4-bit GGUF (22.4 GB). Fits a
  # 36 GB+ Mac; see the memory table in README.md for the 3-bit file (16.8 GB) on 24-32 GB
  # Macs and for the dense Qwen3.6-27B.
  - from: huggingface:huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF
    name: qwen3.6
    files:
      - path: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
    params:
      tools: auto
