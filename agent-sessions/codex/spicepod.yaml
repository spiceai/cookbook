version: v2
kind: Spicepod
name: codex_sessions

dependencies:
  - codex-views

# Paths are relative to your home directory, so start Spice from there:
#   cd ~ && spice run <path to this spicepod.yaml>
#
# The views are in the codex-views dependency (spicepods/codex-views/),
# which snapshot-reader.yaml also uses.

datasets:
  # Codex rollout transcripts: sessions/YYYY/MM/DD/rollout-<time>-<thread id>.jsonl.
  # JSON schema inference can't be used: fields change type between line types
  # (e.g. `payload.output` is a string or an array). Read as single-column CSV,
  # then parse JSON keys from that column (e.g. `column_1->>'type'`).
  - from: file:.codex/sessions/
    name: rollouts
    metadata:
      # File path. The thread id is only in the file name and the first line.
      _location: enabled
    params:
      file_format: csv
      file_extension: .jsonl
      csv_has_header: false
      # Use control-character delimiter/quote that never occur in the transcripts
      csv_delimiter: "\x1f"
      csv_quote: "\x1e"
      # Single Utf8 column, so nothing to infer.
      schema_infer_max_records: 1
    acceleration:
      enabled: true
      params:
        file_watcher: enabled

  # The datasets below are optional: Codex creates each file only when the
  # feature that writes it is used. When a file is missing, its dataset does
  # not load, the views that read it are not created, and Spice does not report
  # ready. All views that read only `rollouts` still work.

  # Every prompt typed into Codex, across all sessions (append-only).
  - from: file:.codex/history.jsonl
    name: history_lines
    params:
      file_format: csv
      file_extension: .jsonl
      csv_has_header: false
      csv_delimiter: "\x1f"
      csv_quote: "\x1e"
      schema_infer_max_records: 1

  # Thread renames (append-only; the last line per id wins).
  - from: file:.codex/session_index.jsonl
    name: session_index_lines
    params:
      file_format: csv
      file_extension: .jsonl
      csv_has_header: false
      csv_delimiter: "\x1f"
      csv_quote: "\x1e"
      schema_infer_max_records: 1

  # Command prefixes approved with "always allow", one prefix_rule(...) per line.
  - from: file:.codex/rules/default.rules
    name: rules_lines
    params:
      file_format: csv
      file_extension: .rules
      csv_has_header: false
      csv_delimiter: "\x1f"
      csv_quote: "\x1e"
      schema_infer_max_records: 1

  # Codex's SQLite state (WAL mode), read live through DuckDB's sqlite_scan
  # (Spice has no SQLite data connector). Safe while Codex runs (WAL
  # readers don't block the writer), but opening creates the -wal/-shm files
  # next to the database. DuckDB downloads its sqlite extension on first use.
  # One row per thread (session, subagent or guardian review), with the title,
  # model and token total that Codex shows in its thread list. The file is
  # elsewhere when `sqlite_home` or CODEX_SQLITE_HOME is set.
  # Accelerated, so that `thread_state` runs in Spice: without acceleration its
  # functions are pushed down to DuckDB, which lacks to_timestamp_millis.
  - from: duckdb:sqlite_scan('.codex/state_5.sqlite', 'threads')
    name: threads_state
    acceleration:
      enabled: true
      refresh_check_interval: 60s

  # Codex memories, one per source thread. Query through the `memories` view.
  - from: duckdb:sqlite_scan('.codex/memories_1.sqlite', 'stage1_outputs')
    name: memory_outputs
    acceleration:
      enabled: true
      refresh_check_interval: 60s
    columns:
      - name: raw_memory
        full_text_search:
          enabled: true
          row_id:
            - thread_id
